<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">

    <header>
      <p class="subtitle">STUDENT PRODUCTIVITY</p>
      <h1>Student Task Manager</h1>
      <p class="description">
        Organize your daily tasks and stay productive.
      </p>
    </header>

    <section class="task-input">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task..."
      />

      <button id="addTaskBtn">
        Add Task
      </button>
    </section>

    <section class="stats">
      <div class="stat-card">
        <span id="totalTasks">0</span>
        <p>Total Tasks</p>
      </div>

      <div class="stat-card">
        <span id="completedTasks">0</span>
        <p>Completed</p>
      </div>

      <div class="stat-card">
        <span id="pendingTasks">0</span>
        <p>Pending</p>
      </div>
    </section>

    <section class="tasks-section">

      <div class="tasks-header">
        <h2>My Tasks</h2>

        <button id="clearBtn" class="clear-btn">
          Clear Completed
        </button>
      </div>

      <ul id="taskList"></ul>

      <p id="emptyMessage" class="empty-message">
        No tasks yet. Add your first task!
      </p>

    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
